name: rebuild-weekly

# Weekly pass for the serverless rebuild. Owner: M3 (docs/rebuild/OWNERSHIP.md).
# Budget: 60 minutes a month (DECISIONS.md D7). Sunday 23:00 UTC is Sunday evening in
# New York in both seasons, so no time-window guard is needed.
# Steps: weekly digest, monthly conviction coherence (first run of each month, New York
# day 1-7), official-source refresh. Every step is safe to run twice.
# Secrets reach only the steps that call the api, through env. Nothing here prints them.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      force_coherence:
        description: "Run the monthly conviction coherence even outside the first week"
        type: boolean
        default: false

concurrency:
  group: rebuild-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_OPENBB_FIXTURE_MODE: ${{ vars.THESIS_DATA_LIVE == 'true' && 'false' || 'true' }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      SCHEDULER_OFFICIAL_SOURCE_TICKERS: ${{ vars.SCHEDULER_OFFICIAL_SOURCE_TICKERS }}
      STEP_TIMEOUT_SECONDS: "240"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check secrets
        id: secrets
        env:
          THESIS_API_URL: ${{ secrets.THESIS_API_URL }}
          THESIS_INTERNAL_TOKEN: ${{ secrets.THESIS_INTERNAL_TOKEN }}
        run: |
          missing=""
          [ -n "${THESIS_API_URL}" ] || missing="${missing} THESIS_API_URL"
          [ -n "${THESIS_INTERNAL_TOKEN}" ] || missing="${missing} THESIS_INTERNAL_TOKEN"
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secret(s):${missing}. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Secrets are set."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jobs/data/requirements.txt

      - name: Install dependencies
        id: deps
        timeout-minutes: 4
        run: python -m pip install --quiet --disable-pip-version-check -r jobs/data/requirements.txt

      - name: Install private OpenBB fork (live mode with FINBASE_READ_TOKEN only)
        if: env.DATA_OPENBB_FIXTURE_MODE == 'false'
        timeout-minutes: 6
        env:
          FINBASE_READ_TOKEN: ${{ secrets.FINBASE_READ_TOKEN }}
        run: |
          if [ -z "${FINBASE_READ_TOKEN}" ]; then
            echo "FINBASE_READ_TOKEN is not set; skipping the private OpenBB fork."
            exit 0
          fi
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${FINBASE_READ_TOKEN}@github.com/rzvsd/finBase.git.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/rzvsd/finBase.git"
          python -m pip install --quiet --disable-pip-version-check -r jobs/data/requirements-live.txt

      # Each step runs even if an earlier one failed; the last step fails the job if any did.

      - name: Weekly digest
        id: digest
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        timeout-minutes: 5
        env:
          THESIS_API_URL: ${{ secrets.THESIS_API_URL }}
          THESIS_INTERNAL_TOKEN: ${{ secrets.THESIS_INTERNAL_TOKEN }}
        run: python jobs/daily/run_step.py weekly-digest

      - name: Conviction coherence (monthly)
        id: coherence
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        timeout-minutes: 5
        env:
          THESIS_API_URL: ${{ secrets.THESIS_API_URL }}
          THESIS_INTERNAL_TOKEN: ${{ secrets.THESIS_INTERNAL_TOKEN }}
          FORCE_COHERENCE: ${{ inputs.force_coherence }}
        run: python jobs/daily/run_step.py conviction-coherence

      - name: Official-source refresh
        id: official
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        timeout-minutes: 5
        env:
          THESIS_API_URL: ${{ secrets.THESIS_API_URL }}
          THESIS_INTERNAL_TOKEN: ${{ secrets.THESIS_INTERNAL_TOKEN }}
        run: python jobs/data/run_official_refresh.py

      - name: Result
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            secrets=${{ steps.secrets.outcome }}
            deps=${{ steps.deps.outcome }}
            digest=${{ steps.digest.outcome }}
            coherence=${{ steps.coherence.outcome }}
            official=${{ steps.official.outcome }}
        run: |
          failed=0
          for item in ${OUTCOMES}; do
            echo "${item}"
            case "${item}" in *=failure) failed=1 ;; esac
          done
          if [ "${failed}" = "1" ]; then
            echo "::error::One or more weekly steps failed. See the step logs above."
            exit 1
          fi
          echo "All weekly steps passed."
