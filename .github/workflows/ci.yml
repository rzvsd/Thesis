name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.6.1 --activate

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: corepack pnpm install --no-frozen-lockfile

      - name: Security | Dependency Audit (critical)
        run: corepack pnpm run security:audit

      - name: Security | Secret Scan (gitleaks)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

      - name: Security | SAST Baseline
        run: corepack pnpm run security:sast

      - name: Phase 6 | Deprecated Dependency Guard
        run: corepack pnpm run phase6:m0:guard

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test
