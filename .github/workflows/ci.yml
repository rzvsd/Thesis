name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.6.1 --activate

      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: corepack pnpm install --frozen-lockfile

      - name: Python dependency lock
        run: python -m uv lock --locked --python 3.11

      - name: Security | Dependency Audit (critical)
        run: corepack pnpm run security:audit

      - name: Security | Secret Scan (gitleaks)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

      - name: Security | SAST Baseline
        run: corepack pnpm run security:sast

      - name: Phase 6 | Deprecated Dependency Guard
        run: corepack pnpm run phase6:m0:guard

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

      - name: Android Gradle build and unit tests
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Docker Compose build smoke
        run: docker compose build product-api data-openbb news-ingest scheduler
