name: deploy-production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "infra/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-production.yml"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      deploy_mode: ${{ steps.mode.outputs.deploy_mode }}

    steps:
      - name: Determine deploy mode from configured secrets
        id: mode
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_REPO_DIR: ${{ secrets.PROD_REPO_DIR }}
        run: |
          set -euo pipefail
          if [ -n "$PROD_SSH_HOST" ] && [ -n "$PROD_SSH_USER" ] && [ -n "$PROD_SSH_PRIVATE_KEY" ] && [ -n "$PROD_REPO_DIR" ]; then
            echo "deploy_mode=remote" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: remote"
          else
            echo "deploy_mode=proof" >> "$GITHUB_OUTPUT"
            echo "Deploy mode: proof (missing production SSH secrets)"
          fi

  deploy-remote:
    needs: preflight
    if: ${{ needs.preflight.outputs.deploy_mode == 'remote' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Resolve deployment ref
        id: resolve_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to production host over CI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            REPO_DIR="${{ secrets.PROD_REPO_DIR }}"
            DEPLOY_REF="${{ steps.resolve_ref.outputs.ref }}"

            if [ -z "$REPO_DIR" ]; then
              echo "PROD_REPO_DIR is not configured."
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch --all --tags --prune
            git checkout "$DEPLOY_REF"
            git reset --hard "$DEPLOY_REF"

            docker compose pull || true
            docker compose up -d --build
            docker compose ps

            curl -fsS http://localhost:3001/health >/dev/null
            curl -fsS http://localhost:3003/health >/dev/null
            curl -fsS http://localhost:3004/health >/dev/null
            curl -fsS http://localhost:3005/health >/dev/null

            echo "Deployment completed for ref: $DEPLOY_REF"

  deploy-proof:
    needs: preflight
    if: ${{ needs.preflight.outputs.deploy_mode == 'proof' }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Resolve deployment ref
        id: resolve_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_ref.outputs.ref }}

      - name: Deploy stack on CI runner (proof mode)
        run: |
          set -euo pipefail
          docker compose up -d --build product-api data-openbb news-ingest scheduler

      - name: Verify health endpoints
        run: |
          set -euo pipefail

          wait_for_service_health() {
            local service="$1"
            local attempts=90
            local sleep_seconds=5

            local container_id
            container_id="$(docker compose ps -q "$service")"
            if [ -z "$container_id" ]; then
              echo "$service container not found."
              docker compose ps -a
              docker compose logs --no-color --tail=200 "$service" || true
              return 1
            fi

            for ((i=1; i<=attempts; i++)); do
              local status
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || echo missing)"

              if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                echo "$service healthy with container status: $status"
                return 0
              fi

              if [ "$status" = "exited" ] || [ "$status" = "dead" ] || [ "$status" = "missing" ]; then
                echo "$service failed with status: $status"
                docker compose ps -a
                docker compose logs --no-color --tail=200 "$service" || true
                return 1
              fi

              sleep "$sleep_seconds"
            done

            echo "$service did not become healthy in time."
            docker compose ps -a
            docker compose logs --no-color --tail=200 "$service" || true
            return 1
          }

          wait_for_service_health "product-api"
          wait_for_service_health "data-openbb"
          wait_for_service_health "news-ingest"
          wait_for_service_health "scheduler"

      - name: Show compose status
        if: always()
        run: docker compose ps -a

      - name: Cleanup runner stack
        if: always()
        run: docker compose down --volumes --remove-orphans
