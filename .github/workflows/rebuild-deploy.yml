name: rebuild-deploy

# Deploys the "api" Edge Function to the Supabase project "thesis" (rebuild). Owner: M1. Needs the owner's review
# (AGENTS rule 7). Chosen by the owner on 2026-11-23 so deploys never need a PC.
# - A push to `rebuild` that changes supabase/functions deploys `api` (AGENTS rule 9: only rebuild deploys api).
# - Audit S4: rebuild is production, so the same checks as rebuild-ci run first, and a failure stops the deploy.
# - Audit S6: the preview functions api-m1 .. api-m4 are gone; this workflow deploys only `api`.
# Secret: SUPABASE_ACCESS_TOKEN (a personal access token from supabase.com/dashboard/account/tokens).
# It is passed to the CLI as an env var only, never echoed, and only on the deploy step.
# About 2 minutes per deploy.
on:
  push:
    branches: [rebuild]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/rebuild-deploy.yml"
  workflow_dispatch:

concurrency:
  group: rebuild-deploy-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_REF: oizahjzcowflmrffoxjg
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Check the branch
        run: |
          [ "$REF_NAME" = "rebuild" ] || { echo "Only the rebuild branch may deploy api."; exit 1; }

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.1.x

      - name: Format, lint, type check and test
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check api/index.ts
          deno test --allow-env --allow-net=127.0.0.1

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set yet. Skipping."
            exit 0
          fi
          npx --yes supabase@2.122.1 functions deploy api \
            --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
