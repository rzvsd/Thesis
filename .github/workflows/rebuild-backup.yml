name: rebuild-backup

# Weekly encrypted dump of the Supabase database (rebuild audit H11). Owner: M0.
# Dormant until the owner sets BACKUP_DB_URL (pooler URL of the read-only role thesis_backup) and BACKUP_PASSPHRASE.
# The dump is encrypted before upload and kept as a run artifact for 35 days. About 2 minutes a week.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: rebuild-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dump and encrypt
        id: dump
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash jobs/ops/backup.sh

      - name: Upload encrypted dump
        if: steps.dump.outputs.file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thesis-db-${{ github.run_id }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 35
          if-no-files-found: error
