name: rebuild-backup

# Weekly encrypted dump of the Supabase database (rebuild audit H11). Owner: M0.
# Dormant until the owner sets BACKUP_DB_URL (pooler URL of the read-only role thesis_backup) and BACKUP_PASSPHRASE.
# The dump is encrypted, then stored in the private Supabase Storage bucket "db-backups". The newest 5 files are
# kept. It is not a run artifact: this repository is public, and anyone signed in to GitHub can download artifacts.
# Storing needs the secret BACKUP_STORAGE_KEY (a Supabase secret key). If the dump exists and that secret is
# missing, the run fails so the gap is seen. About 2 minutes a week.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: rebuild-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # GitHub runs schedules from the default branch (main), but the backup code is on rebuild until the
          # cutover (audit W1). M5 changes this to main at the cutover.
          ref: rebuild
          persist-credentials: false

      - name: Dump and encrypt
        id: dump
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash jobs/ops/backup.sh

      - name: Set up Node.js
        if: steps.dump.outputs.file != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Store in the private bucket
        if: steps.dump.outputs.file != ''
        env:
          SUPABASE_URL: https://oizahjzcowflmrffoxjg.supabase.co
          BACKUP_STORAGE_KEY: ${{ secrets.BACKUP_STORAGE_KEY }}
          BACKUP_FILE: ${{ steps.dump.outputs.file }}
        run: node jobs/ops/backup_store.mts "$BACKUP_FILE"
