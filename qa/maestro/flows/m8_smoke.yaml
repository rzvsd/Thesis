appId: ${MAESTRO_APP_ID}
---

- launchApp:
    optional: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- extendedWaitUntil:
    visible: "Thesis Android MVP"
    timeout: 20000
- assertVisible: "Thesis Android MVP"
- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "Good morning"
    timeout: 30000
- assertVisible: "Pulse"
- assertVisible: "Deep Dive"
- assertVisible: "Watchlist"
- assertVisible: "History"
- assertVisible: "Settings"
- assertVisible: "Good morning"

- tapOn: "Watchlist"
- assertVisible: "Watchlist"
- tapOn: "Ticker"
- inputText: "${MAESTRO_DEEP_DIVE_TICKER}"
- hideKeyboard
- tapOn: "Add"
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "Pulse"
- extendedWaitUntil:
    visible: "My Names"
    timeout: 15000
- assertVisible: "My Names"
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "History"
- extendedWaitUntil:
    visible: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"
    timeout: 30000
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"
- tapOn: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"

- extendedWaitUntil:
    visible: "CURRENT SIGNAL"
    timeout: 30000
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"
- assertVisible: "CURRENT SIGNAL"
- assertVisible: "Deep Dive Modules"

- tapOn: "Pulse"
- scrollUntilVisible:
    element:
      text: "FULL PULSE"
    direction: DOWN
- assertVisible: "FULL PULSE"
- assertVisible: "HISTORY"

- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Open Android Notification Settings"
- assertVisible: "Product API Base URL"
- tapOn: "Logout"

- extendedWaitUntil:
    visible: "Thesis Android MVP"
    timeout: 20000
- assertVisible: "Thesis Android MVP"
