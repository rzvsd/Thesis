appId: ${MAESTRO_APP_ID}
---

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "What Moved"
    timeout: 30000
- assertVisible: "Today"
- assertVisible: "Research"
- assertVisible: "Portfolio"
- assertVisible: "What Moved"

- tapOn: "Portfolio"
- assertVisible: "My Names"
- tapOn: "Ticker"
- inputText: "${MAESTRO_DEEP_DIVE_TICKER}"
- hideKeyboard
- tapOn: "Add"
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "Today"
- extendedWaitUntil:
    visible: "My Names"
    timeout: 15000
- assertVisible: "My Names"
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "Research"
- tapOn: "History"
- extendedWaitUntil:
    visible: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"
    timeout: 30000
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"
- tapOn: "${MAESTRO_DEEP_DIVE_TICKER} Deep Dive"

- extendedWaitUntil:
    visible: "CURRENT SIGNAL"
    timeout: 30000
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"
- assertVisible: "CURRENT SIGNAL"
- assertVisible: "THESIS STATEMENT"

- tapOn: "Today"
- scrollUntilVisible:
    element:
      text: "FULL PULSE"
    direction: DOWN
- assertVisible: "FULL PULSE"
- assertVisible: "HISTORY"

- tapOn: "Portfolio"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Open Android Notification Settings"
