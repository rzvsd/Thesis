appId: ${MAESTRO_APP_ID}
---

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- runFlow:
    when:
      visible: "Login"
    commands:
      - tapOn: "Login"
- runFlow:
    when:
      visible: "Log In"
    commands:
      - tapOn: "Log In"

- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- assertVisible: "Today"
- assertVisible: "Research"
- assertVisible: "Portfolio"
- assertVisible: "What Moved"
- assertVisible: "Fear & Greed"

- tapOn: "Open Dashboard"
- extendedWaitUntil:
    visible: "Fear & Greed Dashboard"
    timeout: 30000
- assertVisible: "Sub-score Breakdown"
- tapOn: "Back"
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "What Moved"
    timeout: 30000

- scrollUntilVisible:
    element:
      text: "Weekly Digest"
    direction: DOWN
- tapOn: "Weekly Digest"
- extendedWaitUntil:
    visible: "Weekly Digest"
    timeout: 30000
- assertVisible: "This Week's Highlights"

- tapOn: "Portfolio"
- assertVisible: "My Names"
- tapOn: "Ticker"
- inputText: "${MAESTRO_DEEP_DIVE_TICKER}"
- hideKeyboard
- tapOn: "Add"
- assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "Today"
- assertVisible: "What Moved"
- scrollUntilVisible:
    element:
      text: "My Names"
    direction: DOWN
- runFlow:
    when:
      visible: "My Names"
    commands:
      - assertVisible: "${MAESTRO_DEEP_DIVE_TICKER}"

- tapOn: "Research"
- assertVisible: "History"

- tapOn: "Today"
- scrollUntilVisible:
    element:
      text: "FULL PULSE"
    direction: DOWN
- assertVisible: "FULL PULSE"
- assertVisible: "HISTORY"

- tapOn: "Portfolio"
- tapOn: "Settings"
- assertVisible: "Settings"
- assertVisible: "Open Android Notification Settings"
