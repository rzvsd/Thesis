appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Thesis Android MVP"
    commands:
      - tapOn: "you@example.com"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn: "Enter password"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - hideKeyboard

- runFlow:
    when:
      visible: "Welcome back"
    commands:
      - tapOn: "name@architecture.com"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn: "Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢Ã¢â‚¬Â¢"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - hideKeyboard

- runFlow:
    when:
      visible: "Login"
    commands:
      - tapOn: "Log In"

- runFlow:
    when:
      visible: "Log In"
    commands:
      - tapOn: "Log In"

- runFlow:
    when:
      visible: "Today"
    commands:
      - tapOn: "Today"

- extendedWaitUntil:
    visible: "Today"
    timeout: 40000

- tapOn: "Portfolio"
- tapOn: "Settings"
- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Product API Base URL"
    direction: DOWN
- tapOn: "Product API Base URL"
- repeat:
    times: 48
    commands:
      - eraseText
- inputText: "http://offline.invalid:3001/"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save API URL"
    direction: DOWN
- tapOn: "Save API URL"
- pressKey: "back"

- launchApp:
    clearState: false

- tapOn: "Research"
- assertVisible: "Deep Dive"
- tapOn: "Ticker Symbol (e.g. AAPL)"
- inputText: "AAPL"
- hideKeyboard
- tapOn: "Run Deep Dive"
- extendedWaitUntil:
    visible: "No internet connection. Please check network and retry."
    timeout: 45000
- assertVisible: "No internet connection. Please check network and retry."



