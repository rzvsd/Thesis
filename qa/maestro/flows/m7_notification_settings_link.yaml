appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- assertVisible: "Thesis Android MVP"
- tapOn: "you@example.com"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Enter password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Log In"

- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "System Notification Settings"



