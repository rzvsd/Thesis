appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- assertVisible: "Thesis Android MVP"
- tapOn: "Email"
- inputText: "${MAESTRO_REGISTER_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Register"
- extendedWaitUntil:
    visible: "Register status: .*"
    timeout: 30000
- assertVisible: "Register status: .*"
- pressKey: "back"
- tapOn: "Verify Account"
- tapOn: "Login"
- extendedWaitUntil:
    visible: "Pulse"
    timeout: 30000
- assertVisible: "Pulse"
