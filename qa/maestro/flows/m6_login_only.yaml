appId: ${MAESTRO_APP_ID}
---

- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Thesis Android MVP"
    commands:
      - tapOn: "you@example.com"
      - inputText: "${MAESTRO_TEST_EMAIL}"
      - tapOn: "Enter password"
      - inputText: "${MAESTRO_TEST_PASSWORD}"
      - hideKeyboard
      - tapOn: "Log In"

- extendedWaitUntil:
    visible: "Today"
    timeout: 40000
- assertVisible: "Today"



