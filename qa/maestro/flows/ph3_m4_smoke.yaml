appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- tapOn: "you@example.com"
- inputText: "${MAESTRO_TEST_EMAIL}"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Enter password"
    direction: DOWN
    timeout: 30000
- tapOn: "Enter password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- runFlow:
    when:
      visible: "Log In"
    commands:
      - tapOn: "Log In"

- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- assertVisible: "Today"
- assertVisible: "Research"
- assertVisible: "Portfolio"

- tapOn: "Today"
- extendedWaitUntil:
    visible: "What Moved"
    timeout: 30000
- assertVisible: "What Moved"

- tapOn: "Research"
- extendedWaitUntil:
    visible: "History"
    timeout: 30000
- assertVisible: "History"

- tapOn: "Portfolio"
- extendedWaitUntil:
    visible: "My Names"
    timeout: 30000
- assertVisible: "My Names"

- tapOn: "Today"
- scrollUntilVisible:
    element:
      text: "Weekly Digest"
    direction: DOWN
    timeout: 60000
- assertVisible: "Weekly Digest"
- tapOn: "Weekly Digest"
- extendedWaitUntil:
    visible: "Latest digest"
    timeout: 30000
- assertVisible: "Latest digest"

- tapOn: "Research"
- assertVisible: "History"
