appId: ${MAESTRO_APP_ID}
---

- launchApp:
    optional: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- extendedWaitUntil:
    visible: "Thesis Android MVP"
    timeout: 20000
- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "Good morning"
    timeout: 30000
- assertVisible: "Settings"
- tapOn: "Settings"
- assertVisible: "Open Android Notification Settings"
- tapOn: "Open Android Notification Settings"
