appId: ${MAESTRO_APP_ID}
---

- launchApp:
    optional: true

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- extendedWaitUntil:
    visible: "Thesis Android MVP"
    timeout: 20000
- tapOn: "you@example.com"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Enter password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- hideKeyboard
- tapOn: "Log In"

- extendedWaitUntil:
    visible: "Good morning"
    timeout: 30000
- assertVisible: "Settings"
- tapOn: "Settings"
- assertVisible: "System Notification Settings"
- tapOn: "System Notification Settings"



