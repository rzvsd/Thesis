appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible: "System UI isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"

- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- assertVisible: "Today"
- assertVisible: "Names"
- assertVisible: "Research"
- assertVisible: "Inbox"
- assertVisible: "You"

- tapOn: "Research"
- extendedWaitUntil:
    visible: "Deep Dive"
    timeout: 30000
- assertVisible: "Deep Dive"
- assertVisible: "War Room"
- assertVisible: "History"

- tapOn: "Deep Dive"
- extendedWaitUntil:
    visible: "Ticker Symbol (e.g. AAPL)"
    timeout: 30000
- assertVisible: "Run Deep Dive"

- tapOn: "You"
- extendedWaitUntil:
    visible: "DATA TRUST"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Monthly Coherence"
    direction: DOWN
    timeout: 60000
- assertVisible: "Monthly Coherence"
