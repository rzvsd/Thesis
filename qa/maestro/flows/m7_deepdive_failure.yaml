appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- extendedWaitUntil:
    visible: "Thesis Android MVP"
    timeout: 20000
- assertVisible: "Thesis Android MVP"
- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Login"

- tapOn: "Deep Dive"
- assertVisible: "Company Deep Dive"
- tapOn: "Search ticker/company"
- inputText: "${MAESTRO_DEEP_DIVE_TICKER}"
- tapOn: "Search"
- tapOn: "Select ${MAESTRO_DEEP_DIVE_TICKER}"

# Force a deterministic API failure for this run by pointing to an invalid host.
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Product API Base URL"
- repeat:
    times: 48
    commands:
      - eraseText
- inputText: "http://offline.invalid:3001/"
- tapOn: "Save API URL"
- pressKey: "back"

- tapOn: "Pulse"
- tapOn: "Deep Dive"
- tapOn: "Run Deep Dive"
- extendedWaitUntil:
    visible: "No internet connection. Please check network and retry."
    timeout: 30000
- assertVisible: "No internet connection. Please check network and retry."

# Retry path: restore valid API URL and rerun from the same selected ticker.
- tapOn: "Settings"
- tapOn: "Product API Base URL"
- repeat:
    times: 48
    commands:
      - eraseText
- inputText: "${MAESTRO_API_BASE_URL}/"
- tapOn: "Save API URL"
- pressKey: "back"

- tapOn: "Pulse"
- tapOn: "Deep Dive"
- tapOn: "Run Deep Dive"
- extendedWaitUntil:
    visible: "Job status: .*"
    timeout: 30000
- assertVisible: "Job status: .*"
