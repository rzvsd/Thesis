appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"

- assertVisible: "Thesis Android MVP"
- tapOn: "Email"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Login"

- tapOn: "Deep Dive"
- assertVisible: "Company Deep Dive"
- tapOn: "Search ticker/company"
- inputText: "${MAESTRO_DEEP_DIVE_TICKER}"
- tapOn: "Search"
- tapOn: "Select ${MAESTRO_DEEP_DIVE_TICKER}"
- tapOn: "Run Deep Dive"

# With short access-token TTL in Product API, this long-running flow forces
# one or more authenticated calls after expiry. App must refresh silently.
- extendedWaitUntil:
    visible: "Job status: .*"
    timeout: 30000
- assertVisible: "Job status: .*"

- tapOn: "Pulse"
- tapOn: "Refresh Latest Pulse"
- extendedWaitUntil:
    visible: "Generated at: .*"
    timeout: 45000
- assertVisible: "Generated at: .*"

- assertVisible: "Pulse"
- assertVisible: "Deep Dive"
- assertVisible: "Settings"
