name: thesis-fintech

services:
  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    environment:
      PORT: 3006
    ports:
      - "${MOBILE_PORT:-3006}:3006"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3006/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  product-api:
    build:
      context: .
      dockerfile: apps/product-api/Dockerfile
    user: "${PRODUCT_API_CONTAINER_USER:-node}"
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      THESIS_ALLOW_PRODUCTION_FIXTURES: "${THESIS_ALLOW_PRODUCTION_FIXTURES:-false}"
      PORT: 3001
      STORE_BACKEND: "${STORE_BACKEND:-postgres}"
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/thesis}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      QUEUE_BACKEND: "${QUEUE_BACKEND:-redis}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      REDIS_JOB_QUEUE_KEY: "${REDIS_JOB_QUEUE_KEY:-jobs:deep_dive}"
      JOB_RECOVERY_ENABLED: "${JOB_RECOVERY_ENABLED:-true}"
      JOB_RECOVERY_RUN_ON_STARTUP: "${JOB_RECOVERY_RUN_ON_STARTUP:-true}"
      JOB_RECOVERY_INTERVAL_SECONDS: "${JOB_RECOVERY_INTERVAL_SECONDS:-30}"
      JOB_RECOVERY_BATCH_SIZE: "${JOB_RECOVERY_BATCH_SIZE:-100}"
      JOB_RECOVERY_QUEUED_STALE_SECONDS: "${JOB_RECOVERY_QUEUED_STALE_SECONDS:-20}"
      JOB_RECOVERY_RUNNING_TIMEOUT_SECONDS: "${JOB_RECOVERY_RUNNING_TIMEOUT_SECONDS:-180}"
      JOB_RECOVERY_REQUEUE_COOLDOWN_SECONDS: "${JOB_RECOVERY_REQUEUE_COOLDOWN_SECONDS:-60}"
      ARTIFACT_ROOT: "${ARTIFACT_ROOT:-/app/data/artifacts}"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}"
      ACCESS_TOKEN_TTL_SECONDS: "${ACCESS_TOKEN_TTL_SECONDS:-900}"
      REFRESH_TOKEN_TTL_SECONDS: "${REFRESH_TOKEN_TTL_SECONDS:-2592000}"
      VERIFICATION_TOKEN_TTL_SECONDS: "${VERIFICATION_TOKEN_TTL_SECONDS:-86400}"
      AUTH_EXPOSE_VERIFICATION_TOKEN: "${AUTH_EXPOSE_VERIFICATION_TOKEN:-true}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-120}"
      TICKER_SYNC_MODE: "${TICKER_SYNC_MODE:-full_then_delta}"
      TICKER_AUTO_SYNC_ENABLED: "${TICKER_AUTO_SYNC_ENABLED:-true}"
      TICKER_AUTO_SYNC_RUN_ON_STARTUP: "${TICKER_AUTO_SYNC_RUN_ON_STARTUP:-true}"
      TICKER_DELTA_SYNC_INTERVAL_SECONDS: "${TICKER_DELTA_SYNC_INTERVAL_SECONDS:-900}"
      TICKER_FULL_SYNC_INTERVAL_SECONDS: "${TICKER_FULL_SYNC_INTERVAL_SECONDS:-86400}"
      TICKER_FULL_NASDAQ_URL: "${TICKER_FULL_NASDAQ_URL:-https://www.nasdaqtrader.com/dynamic/SymDir/nasdaqlisted.txt}"
      TICKER_FULL_OTHER_URL: "${TICKER_FULL_OTHER_URL:-https://www.nasdaqtrader.com/dynamic/SymDir/otherlisted.txt}"
      TICKER_DAILY_DELTA_SOURCE: "${TICKER_DAILY_DELTA_SOURCE:-trading_system_adds_deletes}"
      TICKER_DAILY_DELTA_URL: "${TICKER_DAILY_DELTA_URL:-https://www.nasdaqtrader.com/dynamic/SymDir/TradingSystemAddsDeletes.txt}"
      TICKER_DAILY_DELTA_FILE: "${TICKER_DAILY_DELTA_FILE:-}"
      TICKER_FULL_NASDAQ_FILE: "${TICKER_FULL_NASDAQ_FILE:-}"
      TICKER_FULL_OTHER_FILE: "${TICKER_FULL_OTHER_FILE:-}"
      TICKER_ALLOW_FILE_INPUTS: "${TICKER_ALLOW_FILE_INPUTS:-false}"
      MARKET_PULSE_DATA_OPENBB_BASE_URL: "${MARKET_PULSE_DATA_OPENBB_BASE_URL:-http://data-openbb:3003}"
      MARKET_PULSE_NEWS_INGEST_BASE_URL: "${MARKET_PULSE_NEWS_INGEST_BASE_URL:-http://news-ingest:3004}"
      MARKET_PULSE_TICKERS: "${MARKET_PULSE_TICKERS:-AAPL,MSFT,TSLA}"
      MARKET_PULSE_SCHEMA_VERSION: "${MARKET_PULSE_SCHEMA_VERSION:-1.0.0}"
      PULSE_DEXTER_BRIEF_ENABLED: "${PULSE_DEXTER_BRIEF_ENABLED:-true}"
      PULSE_DEXTER_WORKER_BASE_URL: "${PULSE_DEXTER_WORKER_BASE_URL:-http://dexter-worker:3002}"
      PULSE_DEXTER_TIMEOUT_MS: "${PULSE_DEXTER_TIMEOUT_MS:-6000}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      SENTIMENT_SCHEMA_VERSION: "${SENTIMENT_SCHEMA_VERSION:-1.0.0}"
      PRICE_SERVICE_BASE_URL: "${PRICE_SERVICE_BASE_URL:-http://data-openbb:3003}"
      SENTIMENT_FRED_BASE_URL: "${SENTIMENT_FRED_BASE_URL:-https://api.stlouisfed.org/fred}"
      SENTIMENT_FRED_API_KEY: "${SENTIMENT_FRED_API_KEY:-}"
      SENTIMENT_BREADTH_UNIVERSE_LIMIT: "${SENTIMENT_BREADTH_UNIVERSE_LIMIT:-500}"
      SENTIMENT_BREADTH_CONCURRENCY: "${SENTIMENT_BREADTH_CONCURRENCY:-8}"
      SENTIMENT_MIN_AVAILABLE_INPUTS: "${SENTIMENT_MIN_AVAILABLE_INPUTS:-3}"
      SUBSCRIPTION_TIMEZONE: "${SUBSCRIPTION_TIMEZONE:-America/New_York}"
      REVENUECAT_API_BASE_URL: "${REVENUECAT_API_BASE_URL:-https://api.revenuecat.com/v1}"
      REVENUECAT_PUBLIC_ANDROID_KEY: "${REVENUECAT_PUBLIC_ANDROID_KEY:-}"
      REVENUECAT_SERVER_API_KEY: "${REVENUECAT_SERVER_API_KEY:-}"
      REVENUECAT_WEBHOOK_SECRET: "${REVENUECAT_WEBHOOK_SECRET:-}"
      REVENUECAT_ENTITLEMENT_ID: "${REVENUECAT_ENTITLEMENT_ID:-}"
      PUSH_PROVIDER_MODE: "${PUSH_PROVIDER_MODE:-stub}"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-admin.json"
    ports:
      - "${PRODUCT_API_PORT:-3001}:3001"
    volumes:
      - "./data/artifacts:/app/data/artifacts"
      - "./secrets:/run/secrets:ro"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  dexter-worker:
    build:
      context: .
      dockerfile: apps/dexter-worker/Dockerfile
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      THESIS_ALLOW_PRODUCTION_FIXTURES: "${THESIS_ALLOW_PRODUCTION_FIXTURES:-false}"
      PORT: 3002
      DEXTER_FIXTURE_MODE: "${DEXTER_FIXTURE_MODE:-true}"
      DEXTER_MODEL: "${DEXTER_MODEL:-}"
      DEXTER_PROVIDER_ORDER: "${DEXTER_PROVIDER_ORDER:-openrouter,anthropic,openai}"
      DEXTER_OPENROUTER_MODEL: "${DEXTER_OPENROUTER_MODEL:-openrouter:openai/gpt-5.4-mini}"
      DEXTER_OPENAI_MODEL: "${DEXTER_OPENAI_MODEL:-gpt-5.4-mini}"
      DEXTER_ANTHROPIC_MODEL: "${DEXTER_ANTHROPIC_MODEL:-}"
      DEXTER_PROMPT_SOURCE: "${DEXTER_PROMPT_SOURCE:-local}"
      DEXTER_BUN_BIN: "${DEXTER_BUN_BIN:-bun}"
      DEXTER_AGENT_MAX_ITERATIONS: "${DEXTER_AGENT_MAX_ITERATIONS:-2}"
      DEXTER_MAX_PARALLEL_SECTIONS: "${DEXTER_MAX_PARALLEL_SECTIONS:-4}"
      DEXTER_SECTION_TIMEOUT_MS: "${DEXTER_SECTION_TIMEOUT_MS:-70000}"
      DEXTER_RETRY_SECTION_TIMEOUT_MS: "${DEXTER_RETRY_SECTION_TIMEOUT_MS:-15000}"
      DEXTER_RETRY_BACKOFF_MS: "${DEXTER_RETRY_BACKOFF_MS:-500}"
      DEXTER_MAX_SECTION_RETRIES: "${DEXTER_MAX_SECTION_RETRIES:-0}"
      DEXTER_MIN_SCORED_CLAIM_EVIDENCE_COUNT: "${DEXTER_MIN_SCORED_CLAIM_EVIDENCE_COUNT:-1}"
      DEXTER_MIN_SIGNAL_EVIDENCE_COUNT: "${DEXTER_MIN_SIGNAL_EVIDENCE_COUNT:-2}"
      DEXTER_SIMULATE_TIMEOUT_SECTION: "${DEXTER_SIMULATE_TIMEOUT_SECTION:-}"
      DEXTER_FORCE_FAIL_TICKERS: "${DEXTER_FORCE_FAIL_TICKERS:-FAILME,BADTICKERZZZ}"
      DEXTER_QUEUE_MODE: "${DEXTER_QUEUE_MODE:-true}"
      DEXTER_QUEUE_BLOCK_TIMEOUT_SECONDS: "${DEXTER_QUEUE_BLOCK_TIMEOUT_SECONDS:-5}"
      PRODUCT_API_INTERNAL_BASE_URL: "${PRODUCT_API_INTERNAL_BASE_URL:-http://product-api:3001}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      REDIS_JOB_QUEUE_KEY: "${REDIS_JOB_QUEUE_KEY:-jobs:deep_dive}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}"
      PRICE_SERVICE_BASE_URL: "${PRICE_SERVICE_BASE_URL:-http://data-openbb:3003}"
      PULSE_LLM_EDITORIAL_ENABLED: "${PULSE_LLM_EDITORIAL_ENABLED:-false}"
      PULSE_LLM_PROMPT_VERSION: "${PULSE_LLM_PROMPT_VERSION:-ph7-dexter-pulse-brief-v1}"
      PULSE_LLM_MAX_TOKENS: "${PULSE_LLM_MAX_TOKENS:-420}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      EXASEARCH_API_KEY: "${EXASEARCH_API_KEY:-}"
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-false}"
    ports:
      - "${DEXTER_WORKER_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
      product-api:
        condition: service_healthy

  data-openbb:
    build:
      context: .
      dockerfile: apps/data-openbb/Dockerfile
      args:
        INSTALL_LIVE_OPENBB: "${INSTALL_LIVE_OPENBB:-false}"
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      THESIS_ALLOW_PRODUCTION_FIXTURES: "${THESIS_ALLOW_PRODUCTION_FIXTURES:-false}"
      PORT: 3003
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgres://postgres:postgres@postgres:5432/thesis}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}"
      SEC_USER_AGENT: "${SEC_USER_AGENT:-ThesisFintech/1.0 (ops@thesis.local)}"
      DATA_OPENBB_FIXTURE_MODE: "${DATA_OPENBB_FIXTURE_MODE:-true}"
      PRICE_PROVIDER: "${PRICE_PROVIDER:-none}"
      PRICE_PROVIDER_API_KEY: "${PRICE_PROVIDER_API_KEY:-}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_BURST_ALLOWANCE: "${RATE_LIMIT_BURST_ALLOWANCE:-2}"
      RATE_LIMIT_COOLDOWN_SECONDS: "${RATE_LIMIT_COOLDOWN_SECONDS:-60}"
      FMP_FINANCE_RATE_LIMIT_PER_MINUTE: "${FMP_FINANCE_RATE_LIMIT_PER_MINUTE:-10}"
      FMP_MACRO_RATE_LIMIT_PER_MINUTE: "${FMP_MACRO_RATE_LIMIT_PER_MINUTE:-5}"
      POLYGON_RATE_LIMIT_PER_MINUTE: "${POLYGON_RATE_LIMIT_PER_MINUTE:-5}"
      ALPHA_VANTAGE_RATE_LIMIT_PER_MINUTE: "${ALPHA_VANTAGE_RATE_LIMIT_PER_MINUTE:-5}"
      FMP_API_KEY: "${FMP_API_KEY:-}"
      POLYGON_API_KEY: "${POLYGON_API_KEY:-}"
      ALPHA_VANTAGE_API_KEY: "${ALPHA_VANTAGE_API_KEY:-}"
      M1_HF_REVISION: "${M1_HF_REVISION:-main}"
      M1_TRANSCRIPT_SYNC_TIMEZONE: "${M1_TRANSCRIPT_SYNC_TIMEZONE:-America/New_York}"
      M1_TRANSCRIPT_SYNC_WEEKDAY: "${M1_TRANSCRIPT_SYNC_WEEKDAY:-6}"
    ports:
      - "${DATA_OPENBB_PORT:-3003}:3003"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  news-ingest:
    build:
      context: .
      dockerfile: apps/news-ingest/Dockerfile
    environment:
      PORT: 3004
      NODE_ENV: "${NODE_ENV:-development}"
      THESIS_ALLOW_PRODUCTION_FIXTURES: "${THESIS_ALLOW_PRODUCTION_FIXTURES:-false}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      NEWS_INGEST_FIXTURE_MODE: "${NEWS_INGEST_FIXTURE_MODE:-true}"
      RATE_LIMIT_WINDOW_SECONDS: "${RATE_LIMIT_WINDOW_SECONDS:-60}"
      RATE_LIMIT_BURST_ALLOWANCE: "${RATE_LIMIT_BURST_ALLOWANCE:-2}"
      RATE_LIMIT_COOLDOWN_SECONDS: "${RATE_LIMIT_COOLDOWN_SECONDS:-60}"
      NEWS_SOURCE_RATE_LIMIT_PER_MINUTE: "${NEWS_SOURCE_RATE_LIMIT_PER_MINUTE:-5}"
    ports:
      - "${NEWS_INGEST_PORT:-3004}:3004"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      THESIS_ALLOW_PRODUCTION_FIXTURES: "${THESIS_ALLOW_PRODUCTION_FIXTURES:-false}"
      PORT: 3005
      PRODUCT_API_INTERNAL_BASE_URL: "${PRODUCT_API_INTERNAL_BASE_URL:-http://product-api:3001}"
      DATA_OPENBB_INTERNAL_BASE_URL: "${DATA_OPENBB_INTERNAL_BASE_URL:-http://data-openbb:3003}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-dev-internal-worker-token}"
      SCHEDULER_TIMEZONE: "${SCHEDULER_TIMEZONE:-America/New_York}"
      SCHEDULER_DELIVERY_TIME_LOCAL: "${SCHEDULER_DELIVERY_TIME_LOCAL:-06:30}"
      SCHEDULER_SENTIMENT_TIME_LOCAL: "${SCHEDULER_SENTIMENT_TIME_LOCAL:-18:00}"
      SCHEDULER_HISTORICAL_SYNC_TIME_LOCAL: "${SCHEDULER_HISTORICAL_SYNC_TIME_LOCAL:-01:00}"
      SCHEDULER_TEST_MODE: "${SCHEDULER_TEST_MODE:-false}"
      SCHEDULER_TEST_FIRE_IN_SECONDS: "${SCHEDULER_TEST_FIRE_IN_SECONDS:-120}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
    ports:
      - "${SCHEDULER_PORT:-3005}:3005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      NODE_ENV: "${NODE_ENV:-development}"
    command:
      - sh
      - -c
      - |
        if [ "${NODE_ENV}" = "production" ]; then
          if [ -z "${REDIS_PASSWORD}" ]; then
            echo "REDIS_PASSWORD must be set when NODE_ENV=production" >&2
            exit 1
          fi
          exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$REDIS_PASSWORD\" ]; then redis-cli -a \"$REDIS_PASSWORD\" ping; else redis-cli ping; fi"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      POSTGRES_DB: thesis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${NODE_ENV}" = "production" ] && [ "$${POSTGRES_PASSWORD}" = "postgres" ]; then
          echo "POSTGRES_PASSWORD must not use the local development default when NODE_ENV=production" >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thesis"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
