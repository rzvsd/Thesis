<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Compose Desktop asks for "Noto Sans" for FontFamily.Default/SansSerif; Android uses Roboto. -->
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>Noto Sans</string></test>
    <edit name="family" mode="assign_replace" binding="same"><string>Roboto</string></edit>
  </match>
</fontconfig>
