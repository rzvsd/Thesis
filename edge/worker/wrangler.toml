# Thesis front door (DECISIONS D2). Deploy from this folder: npx wrangler@4.155.0 deploy
# No secrets and no account_id here. GitHub deploys it (.github/workflows/rebuild-edge-deploy.yml).
name = "thesis-front-door"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
API_ORIGIN = "https://oizahjzcowflmrffoxjg.supabase.co"
# Always "api". The Worker ignores any other value (the preview functions were removed, audit S6).
API_FUNCTION = "api"

[triggers]
# Daily keep-alive (H11): GET /health?db=1 at 04:17 UTC.
crons = ["17 4 * * *"]
