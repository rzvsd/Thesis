# Supabase CLI config for the Thesis rebuild. Owner: M0 (see docs/rebuild/OWNERSHIP.md).
# Project ref: oizahjzcowflmrffoxjg (eu-central-1). Link with: supabase link --project-ref oizahjzcowflmrffoxjg
project_id = "thesis"

[api]
# Only these schemas are exposed by the auto-generated REST API. App tables live in "app", which is NOT listed (C3).
schemas = ["public", "graphql_public"]

[db]
major_version = 17

# One function serves the whole API (H3). The guard in _shared/auth.ts checks auth per route, so the
# platform JWT check is off. The preview functions api-m1..api-m4 were removed after the milestones merged
# (audit S6): they would have shared the production database and secrets.
[functions.api]
verify_jwt = false
entrypoint = "./functions/api/index.ts"

